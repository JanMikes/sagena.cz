# Frontend — build the Next.js frontend image (a PRIVATE ghcr package — lily pulls it
# with the box-only D57 credential) and deploy it to lily via the shared reusable workflow
# (TheDevs-cz/ci). Replaces the old build + root-SSH deploy to spare.srv.
#
# ONE HOOK, THREE WORKFLOWS: frontend.yml, strapi.yml and nginx.yml each build
# their own image and all trigger the SAME lily hook `sagena` with tag `main`;
# the box's deploy.sh re-pulls all three and rolls strapi -> frontend -> nginx
# (only the rebuilt image actually changes). See lily.srv D71.

name: Frontend

on:
    push:
        branches:
            - 'main'
        paths:
            - 'frontend/**'
            - '.github/workflows/frontend.yml'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    packages: write

jobs:
    ship:
        uses: TheDevs-cz/ci/.github/workflows/_ship.yml@v1
        secrets:
            DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        with:
            app: sagena
            image: ghcr.io/janmikes/sagena.cz
            context: ./frontend
            build_args: |
                APP_VERSION=${{ github.sha }}
            deploy_host: lily.srv.thedevs.cz
            await_deploy: false
